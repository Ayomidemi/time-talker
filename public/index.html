<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110e" />
    <title>Time Talker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314110e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f3ecdf' stroke-width='1.5'/%3E%3Cpath d='M16 10.5V16l3.5 2' fill='none' stroke='%23b5522a' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="brand">Time Talker</p>
        <p class="lede">Speaks the time on the hour and at half past.</p>
      </header>

      <section class="card" aria-label="Clock">
        <div class="clock">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="54" />
            <circle class="progress" id="progress" cx="60" cy="60" r="54" />
          </svg>
          <div class="face">
            <p class="time">
              <span id="hm">–:––</span>
              <span id="sec">––</span>
            </p>
            <p id="ampm" class="ampm">––</p>
          </div>
        </div>
        <noscript>
          <p class="noscript">JavaScript draws the clock. The half-hour announcements still run from the app itself.</p>
        </noscript>
      </section>

      <section class="announce">
        <p id="until" class="until">Starting the clock…</p>
        <p id="phrase" class="phrase"></p>
        <p id="error" class="error" hidden></p>
      </section>

      <section class="panel" aria-label="Announcement settings">
        <div class="row">
          <div>
            <p class="row-title">Half-hour chime</p>
            <p class="row-help">On at :00 and :30. Off, and it stays quiet.</p>
          </div>
          <button id="toggle" class="switch" type="button" role="switch" aria-checked="true" aria-label="Half-hour chime">
            <span class="knob"></span>
          </button>
        </div>

        <label class="field">
          <span>Voice</span>
          <select id="voice"></select>
        </label>

        <label class="check">
          <input id="period" type="checkbox" checked />
          <span>Say the time of day, such as “in the afternoon.”</span>
        </label>

        <button id="speak" class="say" type="button">Say the time now</button>
      </section>

      <!-- <p class="footnote">
        You can close this tab. Time Talker keeps announcing until you stop it in the terminal.
      </p> -->
      <p id="live" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
